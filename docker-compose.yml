services:
  postgres:
    # Sprint 9C: the stock `postgres:17` image does not ship pgvector
    # at all (`pg_available_extensions` returned zero rows for
    # 'vector' -- confirmed live before switching). `pgvector/pgvector`
    # is the official image: identical to `postgres:17`, same major
    # version, same data directory format, plus the extension's
    # shared libraries. Swapping it is safe for the existing
    # `postgres_data` volume -- no dump/restore needed -- and
    # `CREATE EXTENSION` is still applied explicitly via Alembic, not
    # assumed from the image alone.
    image: pgvector/pgvector:pg17
    container_name: aikdap_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: aikdap_redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: aikdap_backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    extra_hosts: ["host.docker.internal:host-gateway"]

    # Sprint 16 Phase 8.12: `environment:` overrides `env_file` in
    # Compose, and is re-read on every `up`/`recreate` -- unlike
    # `env_file`, which is only read at container CREATION (the exact
    # reason 8.11 found this container still running with a stale
    # SYNTHESIS_MODEL long after `.env` had been edited). Pinning the
    # container-specific values here stops that drift class from
    # recurring: a future `.env` edit alone can no longer silently
    # desync from what's actually running.
    # Sprint 16 Phase 8.13 prerequisite: root .env's DEFAULT_LLM/
    # SYNTHESIS_MODEL are gemini/gemini-flash-latest with the free-tier
    # quota exhausted -- confirmed live via `docker exec ... printenv`
    # before this edit. Pinning both here to the local Qwen model (the
    # same one already verified working end-to-end in Phase 8.4) means
    # a request never silently falls through the cloud fallback chain,
    # which would make the new UnsourcedSynthesizer's answers just as
    # untrustworthy as 8.11's diagnosis found the old ones to be.
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RERANKER_BASE_URL: http://host.docker.internal:8090
      BACKEND_CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://aikdap-frontend.vercel.app,https://tourist-egg-passive-extending.trycloudflare.com"
      DEFAULT_LLM: ollama/qwen3.5:4b
      SYNTHESIS_MODEL: ollama/qwen3.5:4b

    ports:
      - "8001:8000"

    volumes:
      - ./backend:/app

    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend

    container_name: aikdap_worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    extra_hosts: ["host.docker.internal:host-gateway"]

    # See the backend service's identical block above for why this is
    # needed (Compose `environment:` overrides `env_file` and is
    # re-applied on every recreate), including the Phase 8.13
    # DEFAULT_LLM/SYNTHESIS_MODEL pin.
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      RERANKER_BASE_URL: http://host.docker.internal:8090
      BACKEND_CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://aikdap-frontend.vercel.app,https://tourist-egg-passive-extending.trycloudflare.com"
      DEFAULT_LLM: ollama/qwen3.5:4b
      SYNTHESIS_MODEL: ollama/qwen3.5:4b

    volumes:
      - ./backend:/app

    command: celery -A app.workers.worker worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
