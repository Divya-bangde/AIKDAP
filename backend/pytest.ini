[pytest]
testpaths = tests
asyncio_mode = strict
markers =
    live_ollama: requires a real, reachable local Ollama instance (Sprint 11.2). Skipped automatically, not failed, when Ollama is unreachable -- run with Ollama up to exercise it for real.
    requires_tesseract: needs the tesseract OCR binary on PATH. Skipped automatically, not failed, when it is missing (it is installed in the backend Docker image).
    requires_docker_image(name): launches a real container from `name`. Skipped automatically, not failed, when the Docker daemon is unreachable or the image is not present locally (build/pull it to run these).
# Every async test declares its own event loop scope via
# @pytest.mark.asyncio; function scope keeps each test's database
# session isolated.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
